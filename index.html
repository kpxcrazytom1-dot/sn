<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>S/N 스캐너</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  :root{--accent:#3bb39a;--ink:#fff;--muted:#a9b4bd;--bg:#0b0f12;--warn:#f0a167}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  /* 가이드 박스 바깥 어둡게 */
  #box{position:absolute;left:5%;right:5%;top:30%;height:15%;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.55)}
  #box.hit{border-color:#fff}
  #hint{position:absolute;left:0;right:0;top:calc(30% - 34px);text-align:center;font-size:14px;color:var(--muted)}
  #top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700}
  #top small{font-weight:500;color:var(--muted);font-size:12px}
  #res{position:absolute;left:5%;right:5%;top:calc(45% + 14px);display:flex;flex-direction:column;gap:8px;align-items:stretch}
  .chip{border:0;border-radius:12px;padding:14px 16px;font:600 22px ui-monospace,Menlo,monospace;letter-spacing:.03em;background:var(--accent);color:#04201a;text-align:center;word-break:break-all}
  .chip.sub{background:rgba(255,255,255,.14);color:#fff}
  #snEdit{width:100%;min-width:0;border:2px solid var(--accent);border-radius:12px;padding:12px 14px;font:600 22px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-align:center;background:#fff;color:#0b0f12;text-transform:uppercase}
  #snEdit:focus{outline:none;box-shadow:0 0 0 3px rgba(59,179,154,.45)}
  .hint2{text-align:center;font-size:12px;color:var(--muted)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn{border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:700}
  .btn.go{background:var(--accent);color:#04201a}
  .btn.again{background:rgba(255,255,255,.16);color:#fff}
  .chip.wait{background:rgba(255,255,255,.10);color:rgba(255,255,255,.7);pointer-events:none}
  .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
  .chip small{display:block;font:500 11px -apple-system,sans-serif;opacity:.75;letter-spacing:0;margin-top:2px}
  #status{text-align:center;font-size:13px;color:var(--muted);min-height:18px}
  #bottom{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(transparent,rgba(0,0,0,.85) 30%)}
  #recent{list-style:none;margin:0 0 8px;padding:0;max-height:22vh;overflow:auto;font:14px ui-monospace,Menlo,monospace}
  #recent li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12)}
  #recent li span{color:var(--muted);font-size:12px;font-family:-apple-system,sans-serif}
  #recent li button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;font-size:12px;padding:2px 8px}
  #manual{display:flex;gap:8px}
  #manual input{flex:1;min-width:0;font:600 16px ui-monospace,Menlo,monospace;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;text-transform:uppercase}
  #manual button,#startBtn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;background:var(--accent);color:#04201a;font-size:15px}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:999px;font-size:15px;font-weight:600;z-index:9;max-width:92%;text-align:center}
  #toast.dup{background:var(--warn)}
  #startWrap{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:var(--bg);padding:24px;text-align:center}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <div id="top"><span>S/N 스캐너</span><small id="cnt"></small></div>
  <div id="hint">S/N 줄을 박스 안에 가로로 맞추세요</div>
  <div id="box"></div>
  <div id="res"><div id="status">카메라 준비 중…</div></div>
  <div id="bottom">
    <ul id="recent"></ul>
    <form id="manual" autocomplete="off"><input id="mIn" placeholder="직접 입력" autocapitalize="characters" spellcheck="false"><button>기록</button></form>
  </div>
  <div id="startWrap" hidden>
    <div id="startMsg">카메라를 켜려면 아래를 누르세요</div>
    <button id="startBtn">카메라 켜기</button>
  </div>
</div>
<div id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const v = $('#v');
let worker = null, busy = false, running = false, lastTokens = {}, recentList = [];

function toast(msg, dup) {
  const t = $('#toast'); t.textContent = msg; t.className = dup ? 'dup' : ''; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, dup ? 3500 : 1800);
}

/* ---------- 카메라 ---------- */
async function startCam() {
  $('#startWrap').hidden = true;
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    v.srcObject = st; await v.play();
    const tr = st.getVideoTracks()[0];
    try { const cap = tr.getCapabilities ? tr.getCapabilities() : {}; if (cap.focusMode && cap.focusMode.includes('continuous')) tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
    running = true; setStatus('글자 인식 엔진 준비 중… (처음 한 번 몇 초)');
    loop();
  } catch (e) {
    $('#startMsg').textContent = '카메라를 켤 수 없어요 (' + (e.name || e.message) + '). 브라우저 카메라 권한을 허용하고 다시 누르세요.';
    $('#startWrap').hidden = false;
  }
}
$('#startBtn').onclick = startCam;
function setStatus(m) { const s = $('#status'); if (s) s.textContent = m; }

/* ---------- 인식 ---------- */
async function getWorker() {
  if (worker) return worker;
  worker = await Tesseract.createWorker('eng', 1);
  await worker.setParameters({ tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/:.', tessedit_pageseg_mode: '6' });
  return worker;
}
const cv = document.createElement('canvas');
function grab() {
  const vw = v.videoWidth, vh = v.videoHeight; if (!vw) return null;
  // 화면의 가이드 박스 위치를 영상 좌표로 변환 (object-fit: cover 보정)
  const W = v.clientWidth, H = v.clientHeight, sc = Math.max(W / vw, H / vh);
  const ox = (vw * sc - W) / 2, oy = (vh * sc - H) / 2;
  const b = $('#box').getBoundingClientRect(), r = v.getBoundingClientRect();
  const sx = (b.left - r.left + ox) / sc, sy = (b.top - r.top + oy) / sc, sw = b.width / sc, sh = b.height / sc;
  const k = Math.max(1, Math.min(2.5, 1400 / sw));
  cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  // 프레임마다 두 가지 보정을 번갈아 사용 (흑백+대비 / 이진화) → 다수결에 다양한 결과가 모임
  const img = g.getImageData(0, 0, cv.width, cv.height), d = img.data, n = d.length / 4;
  const gray = new Uint8Array(n), hist = new Array(256).fill(0);
  for (let i = 0, j = 0; j < n; i += 4, j++) { const y = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) | 0; gray[j] = y; hist[y]++; }
  grab.flip = !grab.flip;
  if (grab.flip) {
    for (let i = 0, j = 0; j < n; i += 4, j++) { let y = (gray[j] - 128) * 1.5 + 128; y = y < 0 ? 0 : y > 255 ? 255 : y; d[i] = d[i + 1] = d[i + 2] = y; }
  } else {
    let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
    let sB = 0, wB = 0, best = 0, th = 128;
    for (let t = 0; t < 256; t++) { wB += hist[t]; if (!wB) continue; const wF = n - wB; if (!wF) break; sB += t * hist[t];
      const mB = sB / wB, mF = (sum - sB) / wF, v2 = wB * wF * (mB - mF) * (mB - mF); if (v2 > best) { best = v2; th = t; } }
    for (let i = 0, j = 0; j < n; i += 4, j++) { const y = gray[j] > th ? 255 : 0; d[i] = d[i + 1] = d[i + 2] = y; }
  }
  g.putImageData(img, 0, 0);
  return cv;
}
function parse(text) {
  const T = String(text || '').toUpperCase();
  let sn = '';
  const m = T.match(/(?:S\s*[\/.\\]?\s*N|SER(?:IAL)?\.?\s*N[O0]|MFG\.?\s*N[O0])\s*[:.]?\s*([A-Z0-9][A-Z0-9\-]{4,})/);
  if (m) sn = m[1].replace(/[-.]+$/, '');
  const toks = (T.match(/[A-Z0-9][A-Z0-9\-]{3,}[A-Z0-9]/g) || [])
    .filter(t => /\d/.test(t) && !/^(S\/?N|O\/?N)$/.test(t) && t !== sn);
  return { sn, toks: [...new Set(toks)].slice(0, 3) };
}
async function loop() {
  if (!running) return;
  if (document.hidden || busy || locked) { setTimeout(loop, 300); return; }
  busy = true;
  try {
    const w = await getWorker();
    const c = grab();
    if (c) {
      const r = await w.recognize(c);
      render(parse(r.data.text));
    }
  } catch (e) { setStatus('인식 오류: ' + (e.message || e)); }
  busy = false;
  setTimeout(loop, 150);
}
/* 여러 프레임 결과를 모아 글자별 다수결 → 3번 이상 같게 읽히면 '확정' */
const NEED = 4;
let hist = [], locked = '', missStreak = 0, pauseUntil = 0;
function vote(list) {
  const byLen = {};
  list.forEach(t => (byLen[t.length] = byLen[t.length] || []).push(t));
  const group = Object.values(byLen).sort((a, b) => b.length - a.length)[0];
  if (!group) return { text: '', n: 0, ok: false };
  let out = '', ok = true;
  for (let i = 0; i < group[0].length; i++) {
    const c = {}; group.forEach(t => c[t[i]] = (c[t[i]] || 0) + 1);
    const [ch, cnt] = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
    out += ch; if (cnt / group.length < 0.5) ok = false;
  }
  return { text: out, n: group.length, ok: ok && group.length >= NEED };
}
let lastHTML = '';
function show(html) { if (html !== lastHTML) { $('#res').innerHTML = html; lastHTML = html; } }
function render(p) {
  if (Date.now() < pauseUntil || locked) return;
  const cand = p.sn || p.toks.slice().sort((a, b) => b.replace(/\D/g, '').length - a.replace(/\D/g, '').length)[0] || '';
  if (cand) { hist.push(cand); if (hist.length > 9) hist.shift(); missStreak = 0; }
  else if (++missStreak >= 6) hist = [];
  const r = vote(hist);
  if (r.ok) { lockOn(r.text); return; }
  if (r.text) {
    const pct = Math.round(Math.min(r.n, NEED) / NEED * 100);
    show(`<div class="chip wait" style="font-size:16px">읽는 중… 그대로 들고 있어요<div class="bar"><i style="width:${pct}%"></i></div></div>`);
  } else show('<div id="status">S/N 줄을 박스에 맞추세요</div>');
}
/* 확정되면 인식을 멈추고 화면을 고정 → 천천히 확인하고 누르면 됨 */
function lockOn(text) {
  locked = text;
  $('#box').classList.add('hit');
  if (navigator.vibrate) navigator.vibrate(30);
  show(`<input id="snEdit" value="${text}" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" aria-label="시리얼넘버">
    <div class="hint2">틀린 글자만 눌러서 고친 뒤 기록하세요</div>
    <div class="row2"><button class="btn again" id="againBtn">다시 읽기</button><button class="btn go" id="goBtn">기록</button></div>`);
}
function unlock() {
  locked = ''; hist = []; missStreak = 0;
  $('#box').classList.remove('hit');
  show('<div id="status">S/N 줄을 박스에 맞추세요</div>');
}
$('#res').addEventListener('click', e => {
  if (e.target.closest('#goBtn')) record(($('#snEdit') || {}).value || locked);
  else if (e.target.closest('#againBtn')) unlock();
});

/* ---------- 기록 ---------- */
const API = 'https://script.google.com/macros/s/AKfycbzJv_msgD5AgbNjnTNpW6lDfFoFTmYCzDFfl_0c3uYsUn1LdZfllD4tPOxF9W5qhIFbmg/exec';
// 비밀키는 공개 파일에 넣지 않음: 받은 링크의 #k=... 로 한 번 들어오면 이 기기에 저장
let KEY = '';
try {
  const m = location.hash.match(/k=([A-Za-z0-9]+)/);
  if (m) { localStorage.setItem('sn.key', m[1]); history.replaceState(null, '', location.pathname); }
  KEY = localStorage.getItem('sn.key') || '';
} catch (e) {}
let saving = false;
try { recentList = JSON.parse(localStorage.getItem('sn.recent') || '[]'); } catch (e) { recentList = []; }
async function record(sn) {
  sn = String(sn || '').replace(/\s+/g, '').toUpperCase();
  if (sn.length < 3 || saving) return;
  if (!KEY) { toast('기록 키가 없어요. 받은 링크로 다시 여세요', true); return; }
  saving = true;
  if (navigator.vibrate) navigator.vibrate(40);
  toast('기록 중… ' + sn);
  unlock(); pauseUntil = Date.now() + 1500;
  show('<div id="status">기록 중…</div>');
  try {
    const res = await fetch(`${API}?key=${KEY}&sn=${encodeURIComponent(sn)}`);
    const msg = await res.text();
    const ok = msg.startsWith('기록함');
    toast(msg, !ok || msg.includes('주의'));
    if (ok) {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      recentList.unshift({ sn, at: `${p(d.getHours())}:${p(d.getMinutes())}`, note: msg.includes('주의') ? '중복' : '' });
      recentList = recentList.slice(0, 30);
      try { localStorage.setItem('sn.recent', JSON.stringify(recentList)); } catch (e) {}
      renderRecent();
    }
  } catch (e) { toast('기록 실패: 인터넷 연결을 확인하세요', true); }
  saving = false;
}
function renderRecent() {
  $('#cnt').textContent = recentList.length ? `최근 ${recentList.length}건` : '';
  $('#recent').innerHTML = recentList.slice(0, 20).map(r => `<li><b>${r.sn}</b><span>${r.at}${r.note ? ' · ' + r.note : ''}</span></li>`).join('');
}
$('#res').addEventListener('keydown', e => {
  if (e.target.id === 'snEdit' && e.key === 'Enter') { e.preventDefault(); e.target.blur(); record(e.target.value); }
});
$('#manual').addEventListener('submit', e => { e.preventDefault(); const x = $('#mIn').value; $('#mIn').value = ''; $('#mIn').blur(); record(x); });
renderRecent();
startCam();
</script>
</body>
</html>
